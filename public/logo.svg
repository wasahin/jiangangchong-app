<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="金刚宠 Jingangchong">
  <!--
    Brand v3 · 暖陶橙 (2026-11-02)
    金刚宠 logo mark — navy dog head, flat.
    藏蓝 #1B3A5C (structure) · 奶油白 #FAF6EE (fur) · 金刚金 #E2BC6E (accent)
    Flat: solid fills, no gradients, no drop shadow.

    Canonical path alias for /logo-v3.svg.
    Silhouette is ONE continuous path (ears + head + cheek fluff + chin)
    so the outline reads as a single stroke with no internal seams.
  -->

  <!-- silhouette -->
  <path d="M88 40
           L166 112
           C182 88 218 88 234 112
           L312 40
           L284 140
           C306 166 320 200 316 236
           C344 258 338 300 308 306
           C298 326 272 332 252 322
           C236 340 218 346 200 346
           C182 346 164 340 148 322
           C128 332 102 326 92 306
           C62 300 56 258 84 236
           C80 200 94 166 116 140
           Z"
        fill="#FAF6EE" stroke="#1B3A5C" stroke-width="7" stroke-linejoin="round"/>

  <!-- navy eye-mask band (职业符号 · the signature from the IP characters) -->
  <path d="M200 118
           C248 118 284 142 292 180
           C296 202 292 224 282 240
           C266 262 236 272 200 272
           C164 272 134 262 118 240
           C108 224 104 202 108 180
           C116 142 152 118 200 118 Z"
        fill="#1B3A5C"/>

  <!-- eyes -->
  <ellipse cx="163" cy="192" rx="21" ry="24" fill="#FAF6EE"/>
  <ellipse cx="237" cy="192" rx="21" ry="24" fill="#FAF6EE"/>
  <circle cx="167" cy="196" r="10" fill="#1B3A5C"/>
  <circle cx="241" cy="196" r="10" fill="#1B3A5C"/>

  <!-- muzzle + nose -->
  <ellipse cx="200" cy="250" rx="44" ry="34" fill="#FAF6EE"/>
  <path d="M200 236 C211 236 219 243 219 250 C219 258 210 264 200 264
           C190 264 181 258 181 250 C181 243 189 236 200 236 Z" fill="#1B3A5C"/>
  <path d="M200 264 L200 272" stroke="#1B3A5C" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M200 272 C194 282 182 284 176 280" stroke="#1B3A5C" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M200 272 C206 282 218 284 224 280" stroke="#1B3A5C" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- gold forehead mark -->
  <path d="M200 102 L212 124 L200 118 L188 124 Z" fill="#E2BC6E"/>
</svg>
