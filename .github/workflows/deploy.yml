name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      # 所有分支都触发；由 job 级的 if 决定走正式环境还是预览环境
      - '**'
  workflow_dispatch:

jobs:
  # ── 正式环境：只由 main 触发 ──
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_FEISHU_APP_ID: ${{ secrets.NEXT_PUBLIC_FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          NEXT_PUBLIC_FEISHU_BASE_ID: ${{ secrets.NEXT_PUBLIC_FEISHU_BASE_ID }}
          NEXT_PUBLIC_FEISHU_TABLE_ID: ${{ secrets.NEXT_PUBLIC_FEISHU_TABLE_ID }}
          NEXT_PUBLIC_STAFF_PASSWORD: ${{ secrets.NEXT_PUBLIC_STAFF_PASSWORD }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
          STAFF_TOKEN_SECRET: ${{ secrets.STAFF_TOKEN_SECRET }}

      - name: Verify build output
        run: |
          echo "=== 验证构建产物 ==="
          if [ ! -d "out" ]; then
            echo "::error::out 目录不存在!"
            exit 1
          fi
          FILE_COUNT=$(find out -type f | wc -l)
          echo "文件总数: $FILE_COUNT"
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "::error::out 目录为空!"
            exit 1
          fi
          echo "✓ 构建产物验证通过"

      - name: Copy Functions to Build Output
        run: |
          echo "=== 复制 Functions ==="
          if [ -d "functions" ]; then
            cp -r functions out/functions
            echo "✓ Functions copied"
          else
            echo "⚠️ functions 目录不存在"
          fi

      - name: Install wrangler
        run: npm install -g wrangler@latest

      - name: Set Pages runtime secrets (production)
        run: |
          printf '%s' "$STAFF_PASSWORD" | wrangler pages secret put STAFF_PASSWORD --project-name jiangangchong-app --env production
          printf '%s' "$STAFF_TOKEN_SECRET" | wrangler pages secret put STAFF_TOKEN_SECRET --project-name jiangangchong-app --env production
        env:
          STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
          STAFF_TOKEN_SECRET: ${{ secrets.STAFF_TOKEN_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: |
          echo "=== 部署到 Cloudflare Pages ==="
          wrangler pages deploy out --project-name jiangangchong-app
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deployment summary
        run: |
          echo "## 🚀 Cloudflare Pages 部署摘要" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| 仓库 | ${{ github.repository }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 分支 | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ 部署成功" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "访问地址: https://jiangangchong-app.pages.dev" >> $GITHUB_STEP_SUMMARY

  # ── 预览环境：任何非 main 分支（push 或手动 dispatch）──
  preview:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_FEISHU_APP_ID: ${{ secrets.NEXT_PUBLIC_FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          NEXT_PUBLIC_FEISHU_BASE_ID: ${{ secrets.NEXT_PUBLIC_FEISHU_BASE_ID }}
          NEXT_PUBLIC_FEISHU_TABLE_ID: ${{ secrets.NEXT_PUBLIC_FEISHU_TABLE_ID }}
          NEXT_PUBLIC_STAFF_PASSWORD: ${{ secrets.NEXT_PUBLIC_STAFF_PASSWORD }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
          STAFF_TOKEN_SECRET: ${{ secrets.STAFF_TOKEN_SECRET }}

      - name: Verify build output
        run: |
          echo "=== 验证构建产物 ==="
          if [ ! -d "out" ]; then
            echo "::error::out 目录不存在!"
            exit 1
          fi
          FILE_COUNT=$(find out -type f | wc -l)
          echo "文件总数: $FILE_COUNT"
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "::error::out 目录为空!"
            exit 1
          fi
          echo "✓ 构建产物验证通过"

      - name: Copy Functions to Build Output
        run: |
          echo "=== 复制 Functions ==="
          if [ -d "functions" ]; then
            cp -r functions out/functions
            echo "✓ Functions copied"
          else
            echo "⚠️ functions 目录不存在"
          fi

      - name: Install wrangler
        run: npm install -g wrangler@latest

      - name: Set Pages runtime secrets (preview)
        continue-on-error: true
        run: |
          printf '%s' "$STAFF_PASSWORD" | wrangler pages secret put STAFF_PASSWORD --project-name jiangangchong-app --env preview
          printf '%s' "$STAFF_TOKEN_SECRET" | wrangler pages secret put STAFF_TOKEN_SECRET --project-name jiangangchong-app --env preview
        env:
          STAFF_PASSWORD: ${{ secrets.STAFF_PASSWORD }}
          STAFF_TOKEN_SECRET: ${{ secrets.STAFF_TOKEN_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy preview to Cloudflare Pages
        run: |
          echo "=== 部署预览环境 ==="
          # 分支名里的 / 不能进主机名，统一换成 -（Cloudflare 还会按长度截断别名）
          BRANCH_ALIAS=$(echo "${{ github.ref_name }}" | tr '/' '-')
          echo "预览别名: $BRANCH_ALIAS"
          wrangler pages deploy out \
            --project-name jiangangchong-app \
            --branch "$BRANCH_ALIAS" \
            --commit-hash "${{ github.sha }}" \
            --commit-message "${{ github.event.head_commit.message }}" \
            2>&1 | tee deploy.log
          # 从 wrangler 输出里抓真实部署地址（别名会被 Cloudflare 截断，猜不出来）
          DEPLOY_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' deploy.log | tail -1)
          echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_ENV
          echo "实际部署地址: $DEPLOY_URL"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deployment summary
        run: |
          echo "## 🔍 Cloudflare Pages 预览部署" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 值 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| 分支 | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ 预览部署成功" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "预览地址: ${{ env.DEPLOY_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "正式地址: https://jiangangchong-app.pages.dev" >> $GITHUB_STEP_SUMMARY
